<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码访问 - 智能任务管理Pro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            color: #333;
        }
        h1 {
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        .qr-code {
            margin: 2rem 0;
            padding: 1rem;
            background: white;
            border-radius: 10px;
        }
        .url {
            font-size: 1.25rem;
            font-weight: 600;
            color: #667eea;
            margin: 1rem 0;
            padding: 1rem;
            background: #f0f0f0;
            border-radius: 10px;
            word-break: break-all;
        }
        .instructions {
            text-align: left;
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f9f9f9;
            border-radius: 10px;
            line-height: 1.8;
        }
        .instructions h3 {
            margin-top: 0;
            color: #667eea;
        }
        .instructions ol {
            margin: 0;
            padding-left: 1.5rem;
        }
        .note {
            margin-top: 1rem;
            padding: 1rem;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 5px;
            font-size: 0.9rem;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>📱 移动端访问</h1>
        <p style="font-size: 1.1rem; color: #666;">智能任务管理Pro</p>
        
        <div class="qr-code" id="qrcode"></div>
        
        <div class="url">http://192.168.0.118:8080</div>
        
        <div class="instructions">
            <h3>📋 访问步骤：</h3>
            <ol>
                <li>确保手机和电脑连接<strong>同一个WiFi</strong></li>
                <li>使用手机浏览器扫描上方二维码</li>
                <li>或直接在浏览器中输入上方网址</li>
                <li>推荐使用 Safari（iOS）或 Chrome（Android）</li>
            </ol>
            
            <div class="note">
                <strong>💡 提示：</strong>如果无法访问，请检查：
                <br>• 手机和电脑是否在同一WiFi网络
                <br>• 电脑防火墙是否允许8080端口
                <br>• 服务器是否正在运行
            </div>
        </div>
        
        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 2px solid #eee;">
            <p style="color: #999; font-size: 0.9rem;">
                服务器运行在：<code style="background: #f0f0f0; padding: 0.25rem 0.5rem; border-radius: 3px;">192.168.0.118:8080</code>
            </p>
        </div>
    </div>

    <script>
        // 生成二维码
        new QRCode(document.getElementById("qrcode"), {
            text: "http://192.168.0.118:8080",
            width: 256,
            height: 256,
            colorDark: "#667eea",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
